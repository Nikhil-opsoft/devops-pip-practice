apiVersion: v1
kind: Namespace
metadata:
  name: pip-prod
  labels:
    env: prod-like
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: pip-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-viewer
  namespace: pip-prod
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer-can-view
  namespace: pip-prod
subjects:
  - kind: ServiceAccount
    name: viewer
    namespace: pip-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-viewer
