apiVersion: v1
kind: ConfigMap
metadata:
  name: day5-app-config
  namespace: pip-prod
data:
  APP_ENV: "prod-like"
  GREETING: "Welcome"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: day5-app
  namespace: pip-prod
  labels:
    app: day5-app
  annotations:
    kubernetes.io/change-cause: "initial deploy of 1.2"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: day5-app
  template:
    metadata:
      labels:
        app: day5-app
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: day5-app
          image: nikhilopsoft/day5-app:1.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: day5-app-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: day5-app-secret
                  key: API_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: day5-app
  namespace: pip-prod
spec:
  type: ClusterIP
  selector:
    app: day5-app
  ports:
    - port: 80
      targetPort: 8080
