apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: day5-app
  namespace: pip-prod
spec:
  ingressClassName: traefik
  rules:
    - host: day5.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: day5-app
                port:
                  number: 80
