apiVersion: apps/v1
kind: Deployment
metadata:
  name: day5-app
  labels:
    app: day5-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: day5-app
  template:
    metadata:
      labels:
        app: day5-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: day5-app
          image: nikhilopsoft/day5-app:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: day5-app
spec:
  type: NodePort
  selector:
    app: day5-app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
