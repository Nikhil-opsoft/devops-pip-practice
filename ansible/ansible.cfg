[defaults]
inventory = inventory.ini
interpreter_python = auto_silent
timeout = 30

[ssh_connection]
# Reuse one SSH connection, detect dead ones quickly, accept the host key on first connect only
ssh_args = -C -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new
# Send modules over the open connection instead of copying files (1 connection per task, not 3)
pipelining = True
# Reconnect up to 3 times if a connection drops
retries = 3
