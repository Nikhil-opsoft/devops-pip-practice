---
- name: Configure the Day 15 web server
  hosts: web
  become: true
  vars:
    node_exporter_version: "1.9.1"
    node_exporter_dir: "node_exporter-{{ node_exporter_version }}.linux-amd64"
    node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"

  tasks:
    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Deploy the web page
      ansible.builtin.copy:
        dest: /usr/share/nginx/html/index.html
        content: "<h1>Day 15 - configured by Ansible</h1><p>{{ inventory_hostname }}</p>\n"
        mode: "0644"

    - name: Start and enable nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true

    - name: Create a system user for node_exporter (no login, no home)
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /sbin/nologin
        create_home: false

    - name: Download node_exporter (checksum verified)
      ansible.builtin.get_url:
        url: "{{ node_exporter_url }}/{{ node_exporter_dir }}.tar.gz"
        dest: "/tmp/{{ node_exporter_dir }}.tar.gz"
        checksum: "sha256:{{ node_exporter_url }}/sha256sums.txt"
        mode: "0644"

    - name: Unpack node_exporter
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_exporter_dir }}.tar.gz"
        dest: /opt
        remote_src: true
        creates: "/opt/{{ node_exporter_dir }}/node_exporter"

    - name: Install the node_exporter binary
      ansible.builtin.copy:
        src: "/opt/{{ node_exporter_dir }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        mode: "0755"
      notify: Restart node_exporter

    - name: Install the node_exporter systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus node_exporter
          After=network-online.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter

    - name: Apply pending restarts now
      ansible.builtin.meta: flush_handlers

    - name: Start and enable node_exporter
      ansible.builtin.systemd_service:
        name: node_exporter
        state: started
        enabled: true

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd_service:
        name: node_exporter
        state: restarted
        daemon_reload: true
